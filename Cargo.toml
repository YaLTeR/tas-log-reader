[package]
name = "tas-log-reader"
version = "0.1.0"
authors = ["Ivan Molodetskikh <yalterz@gmail.com>"]
edition = "2021"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
futures-util = "0.3.34"
gettext-rs = { version = "0.6", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_6"] }
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
debug = true
